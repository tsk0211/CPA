# Render "Blueprint" — infrastructure as code for the free web service.
# Render dashboard -> New -> Blueprint -> point at this repo. Render reads
# this file and proposes the service below; you only fill in the envVars
# marked `sync: false` (secrets, never committed) in the dashboard.
#
# See ../README.md "Deploy" section for the one-time MongoDB Atlas + Owner
# seeding steps that go alongside this.

services:
  # Distinct name from the v1.0.0 service ("cpa-server", live as
  # cpa-server-3js1) so this Blueprint creates a brand-new service +
  # database rather than colliding with the live one — v1.0.0 and v1.1.0
  # run side by side until this branch is ready to replace it.
  - type: web
    name: cpa-server-v1-1-0
    runtime: node
    plan: free
    rootDir: server
    # NODE_ENV=production below makes plain `npm install` skip
    # devDependencies — which is exactly where typescript and every @types/*
    # package live, so the TS compiler can't even find its own type
    # declarations. --include=dev forces them in for the build step; the
    # deployed *runtime* is still unaffected (dist/ is plain compiled JS).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets and per-deployment values — set these in the Render
      # dashboard after the first Blueprint sync, never in this file.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Tunable defaults — fine to leave as-is, override here if needed.
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: MIN_PASSWORD_LENGTH
        value: "8"
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_REMEMBER_ME_DAYS
        value: "30"
      - key: REFRESH_TOKEN_TTL_DEFAULT_DAYS
        value: "1"
      # Tightened from "*" now that a real web frontend exists (GitHub
      # Pages) — the mobile app isn't subject to CORS at all, so this only
      # ever mattered for browser-based clients. See security review notes.
      - key: CORS_ORIGIN
        value: "https://tsk0211.github.io"
      - key: LOGIN_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"
